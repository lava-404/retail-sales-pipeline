# Airflow only. Airbyte runs separately (abctl, http://localhost:8000).
x-airflow-common: &airflow-common
  build: .
  env_file: ../.env
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # dbt + validation inside the container read these:
    GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/secrets/gcp-key.json
    DBT_PROJECT_DIR: /opt/airflow/dbt_project
    DBT_PROFILES_DIR: /opt/airflow/dbt_project
    # Airbyte connection (client-credentials auth). Verify the URI format against your provider version.
    AIRFLOW_CONN_AIRBYTE_DEFAULT: "airbyte://${AIRBYTE_CLIENT_ID}:${AIRBYTE_CLIENT_SECRET}@host.docker.internal:8000"
  volumes:
    - ./dags:/opt/airflow/dags
    - ../dbt_project:/opt/airflow/dbt_project
    - ../secrets:/opt/airflow/secrets:ro
    - ./logs:/opt/airflow/logs
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "airflow db migrate &&
      airflow users create --username $${_AIRFLOW_WWW_USER_USERNAME:-admin}
      --password $${_AIRFLOW_WWW_USER_PASSWORD:-admin} --firstname Admin --lastname User
      --role Admin --email admin@example.com"
    depends_on:
      postgres: {condition: service_healthy}

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports: ["8080:8080"]
    depends_on:
      airflow-init: {condition: service_completed_successfully}

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init: {condition: service_completed_successfully}

volumes:
  pgdata:
