version: 2

sources:
  - name: airbyte_raw
    description: Raw retail transactions loaded by Airbyte from retail_sales_dataset.csv.
    database: "{{ env_var('GCP_PROJECT_ID') }}"
    schema: "{{ env_var('BQ_RAW_DATASET', 'retail_raw') }}"
    tables:
      - name: retail_sales
        identifier: "{{ env_var('RAW_TABLE', 'retail_sales') }}"
        description: One row per transaction (1,000 rows in the supplied file).
        loaded_at_field: _airbyte_extracted_at
        columns:
          - name: "{{ var('raw_columns')['transaction_id'] }}"
            tests: [not_null]
